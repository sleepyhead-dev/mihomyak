# Experiment: mihomo with the REALITY client version of current Xray (26.3.27)
# instead of the hard-coded 1.8.2, to reach servers that set minClientVer.
name: REALITY version experiment

on:
  push:
    branches: ["exp/**"]

permissions:
  contents: read

jobs:
  mihomo:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          repository: MetaCubeX/mihomo
          ref: v1.19.31
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Patch the version bytes
        run: |
          f=component/tls/reality.go
          sed -i 's/hello.SessionId\[0\] = 1$/hello.SessionId[0] = 26/; s/hello.SessionId\[1\] = 8$/hello.SessionId[1] = 3/; s/hello.SessionId\[2\] = 2$/hello.SessionId[2] = 27/' "$f"
          grep -n 'hello.SessionId\[[012]\] =' "$f"
          grep -q 'SessionId\[0\] = 26' "$f" && grep -q 'SessionId\[2\] = 27' "$f"
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags with_gvisor -trimpath \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=v1.19.31-reality26 -w -s" -o mihomo .
          ./mihomo -v
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-reality26-arm64
          path: mihomo
