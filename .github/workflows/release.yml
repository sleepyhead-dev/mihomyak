name: Release

# Publishes the version in Cargo.toml:
#   * a GitHub release with static binaries for x86_64, aarch64 and armv7,
#     SHA256SUMS and the CHANGELOG section as notes;
#   * the multi-arch image ghcr.io/<owner>/mihomyak:{X.Y.Z, X.Y, latest}.
#
# Two ways to start it, both wait for the full CI suite:
#   * push a tag `vX.Y.Z` that matches Cargo.toml;
#   * Actions → Release → "Run workflow" on main: the tag is created here
#     (or reused if it already exists, so a failed release can simply be re-run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  version:
    name: Version and tag
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::warning::$tag already exists: re-publishing it (bump Cargo.toml for a new release)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "mihomyak $version"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: Package ${{ matrix.target }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      # The binaries the reused CI built and tested from this very commit.
      - uses: actions/download-artifact@v4
        with:
          name: mihomyak-${{ matrix.target }}
          path: bin
      - name: Package
        run: |
          name="mihomyak-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          install -m 755 bin/mihomyak "$name/mihomyak"
          cp README.md LICENSE CHANGELOG.md "$name/"
          cp -r deploy "$name/"
          # Stable file name: releases/latest/download/mihomyak-<target>.tar.gz
          tar czf "mihomyak-${{ matrix.target }}.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: mihomyak-*.tar.gz
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      # Only the tarballs: the reused CI jobs upload their own artifacts too.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist && sha256sum mihomyak-*.tar.gz > SHA256SUMS && cat SHA256SUMS && cd ..
          # The CHANGELOG section of this version, else the Unreleased one.
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = ($0 ~ "\\[" v "\\]") }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk '/^## \[Unreleased\]/ {found=1; next} /^## \[/ {if (found) exit} found' CHANGELOG.md > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: mihomyak ${{ needs.version.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: |
            dist/mihomyak-*.tar.gz
            dist/SHA256SUMS

  image:
    name: Container image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mihomyak-*-linux-musl*
          path: artifacts
      - name: Lay out the CI binaries as dist/<arch>/mihomyak
        run: |
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl \
                      armv7:armv7-unknown-linux-musleabihf; do
            mkdir -p "dist/${pair%%:*}"
            cp "artifacts/mihomyak-${pair#*:}/mihomyak" "dist/${pair%%:*}/mihomyak"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.tag, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: BINARY=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # What users download must work: the archive and the image, on both
  # architectures, fetched anonymously exactly as the README says.
  verify:
    name: Verify published (${{ matrix.arch }})
    needs: [version, publish, image]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Release archive
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/mihomyak-${{ matrix.target }}.tar.gz" | tar xz
          ./mihomyak-*/mihomyak --version | tee version.txt
          grep -qF "mihomyak ${TAG#v}" version.txt
      - name: Published image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          docker pull "$image"
          ./tests/e2e/smoke.sh "$image"
