name: CI

# Pull requests and main: lint, tests, MSRV, static builds for every target,
# supply-chain audit and a Docker end-to-end test. Pushes to main also publish
# a multi-arch `edge` image to GHCR. release.yml reuses this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MIHOMO_VERSION: v1.19.31

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      - name: Fetch mihomo for config validation
        run: |
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz && chmod +x mihomo && ./mihomo -v
          echo "MIHOMYAK_TEST_MIHOMO=$PWD/mihomo" >> "$GITHUB_ENV"
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    env:
      # The test suite of the ARM targets runs under qemu-user.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64-static
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: qemu-arm-static
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y clang lld musl-tools qemu-user-static
      - run: ./scripts/build-static.sh ${{ matrix.target }}
        env:
          RUSTFLAGS: -D warnings
      - name: Smoke test (native or qemu)
        run: |
          bin="target/${{ matrix.target }}/release/mihomyak"
          case "${{ matrix.target }}" in
            aarch64-*) run="qemu-aarch64-static $bin" ;;
            armv7-*) run="qemu-arm-static $bin" ;;
            *) run="$bin" ;;
          esac
          $run --version
          $run --help > /dev/null
          ls -l "$bin"
      # ARM is the primary target: run the whole suite there too (x86_64 runs in `check`).
      - name: Tests (qemu)
        if: ${{ !startsWith(matrix.target, 'x86_64') }}
        run: ./scripts/build-static.sh ${{ matrix.target }} test
      - uses: actions/upload-artifact@v4
        with:
          name: mihomyak-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mihomyak
          retention-days: 14
          if-no-files-found: error

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The image packs the static binaries of the `build` job (Dockerfile
  # BINARY=prebuilt): no second compilation, and the image ships exactly the
  # binaries that were tested and that a release attaches.
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the static binaries
        uses: actions/download-artifact@v4
        with:
          pattern: mihomyak-*-linux-musl*
          path: artifacts
      - name: Lay them out as dist/<arch>/mihomyak
        run: |
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl \
                      armv7:armv7-unknown-linux-musleabihf; do
            mkdir -p "dist/${pair%%:*}"
            cp "artifacts/mihomyak-${pair#*:}/mihomyak" "dist/${pair%%:*}/mihomyak"
          done
          ls -l dist/*/mihomyak
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: BINARY=prebuilt
          load: true
          tags: mihomyak:ci
      - name: End-to-end test (mock panel, proxy and TUN gateway with kill switch)
        run: ./tests/e2e/smoke.sh mihomyak:ci
      # For hands-on tests on an ARM box without registry credentials:
      #   gunzip -c mihomyak-arm64.tar.gz | docker load   (tag mihomyak:ci-arm64)
      - name: Export the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: BINARY=prebuilt
          tags: mihomyak:ci-arm64
          outputs: type=docker,dest=${{ runner.temp }}/mihomyak-arm64.tar
      - run: gzip -9 "$RUNNER_TEMP/mihomyak-arm64.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: image-arm64
          path: ${{ runner.temp }}/mihomyak-arm64.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Validate compose files
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.gateway.yml config --quiet
          docker compose -f deploy/compose.proxy.yml config --quiet
      # main only: publish the multi-arch `edge` image.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: BINARY=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # `docker build .` compiles from source for users without prebuilt binaries.
  # That path is slow, so it is checked on main and when a PR touches it.
  docker-source:
    name: Docker image from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] \
            || git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" \
              | grep -qE '^(Dockerfile|\.dockerignore|Cargo\.(toml|lock)|rust-toolchain)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile and dependencies unchanged: skipped"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mihomyak:source
          cache-from: type=gha,scope=source-amd64
          cache-to: type=gha,scope=source-amd64,mode=max
      - if: steps.changed.outputs.run == 'true'
        run: docker run --rm mihomyak:source --version
