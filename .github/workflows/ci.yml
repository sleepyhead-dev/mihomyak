name: CI

# Pull requests and main: lint, tests, MSRV, static builds for every target,
# supply-chain audit and a Docker end-to-end test. Pushes to main also publish
# a multi-arch `edge` image to GHCR. release.yml reuses this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MIHOMO_VERSION: v1.19.31

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      - name: Fetch mihomo for config validation
        run: |
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz && chmod +x mihomo && ./mihomo -v
          echo "MIHOMYAK_TEST_MIHOMO=$PWD/mihomo" >> "$GITHUB_ENV"
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y clang lld musl-tools qemu-user-static
      - run: ./scripts/build-static.sh ${{ matrix.target }}
        env:
          RUSTFLAGS: -D warnings
      - name: Smoke test (native or qemu)
        run: |
          bin="target/${{ matrix.target }}/release/mihomyak"
          case "${{ matrix.target }}" in
            aarch64-*) run="qemu-aarch64-static $bin" ;;
            armv7-*) run="qemu-arm-static $bin" ;;
            *) run="$bin" ;;
          esac
          $run --version
          $run --help > /dev/null
          ls -l "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: mihomyak-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mihomyak
          retention-days: 14
          if-no-files-found: error

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mihomyak:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      - name: End-to-end test (mock panel, proxy and TUN gateway with kill switch)
        run: ./scripts/e2e-docker.sh mihomyak:ci
      - name: Validate compose files
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.gateway.yml config --quiet
          docker compose -f deploy/compose.proxy.yml config --quiet
      # main only: publish the multi-arch `edge` image.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=multiarch
          cache-to: type=gha,scope=multiarch,mode=max
