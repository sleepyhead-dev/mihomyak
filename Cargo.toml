[package]
name = "mihomyak"
description = "Lightweight mihomo supervisor for CIS-style subscriptions that emulates FlClashX / Koala Clash."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sleepyhead-dev/mihomyak"
keywords = ["mihomo", "clash", "proxy", "subscription", "remnawave"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = ["tui"]
# Interactive terminal UI (`mihomyak tui`). Disable for the smallest possible binary.
tui = ["dep:ratatui"]

[dependencies]
anyhow = "1"
base64 = "0.22"
brotli-decompressor = "5"
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "env",
] }
flate2 = "1"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
