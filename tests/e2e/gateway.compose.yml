# Stand for tests/e2e/gateway.sh: a fake panel, two shadowsocks nodes and a
# "website" reachable only through the nodes. Every resource is named mhk-*.
#
#   MIHOMYAK_IMAGE=mihomyak:local docker compose -f tests/e2e/gateway.compose.yml up -d
#
# mhk-wan    10.203.0.0/24: gateway, panels, nodes (a normal bridge: the kill
#            switch test needs a real route out of the gateway);
# mhk-inet   203.0.113.0/24, internal: the target and the nodes only. The gateway
#            reaches the target through a node or not at all, and the target
#            answers with the address it was reached from.

name: mhk-e2e

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

x-panel: &panel
  <<: *hardened
  image: python:3-alpine
  volumes: [./mock_panel.py:/e2e/mock_panel.py:ro]

x-node: &node
  <<: *hardened
  image: ${MIHOMO_IMAGE:-metacubex/mihomo:v1.19.31}
  command: ["-d", "/tmp", "-f", "/e2e/node-ss.yaml"]
  tmpfs: [/tmp]
  volumes: [./node-ss.yaml:/e2e/node-ss.yaml:ro]

services:
  mhk-gw:
    <<: *hardened
    image: ${MIHOMYAK_IMAGE:?set MIHOMYAK_IMAGE}
    container_name: mhk-gw
    hostname: mhk-e2e
    environment:
      MIHOMYAK_SUB_URL: http://10.203.0.10:8080/sub/gateway
      MIHOMYAK_GATEWAY: "1"
      MIHOMYAK_KILL_SWITCH: "1"
      MIHOMYAK_LOG: info
      TZ: Europe/Moscow
    volumes:
      - ./gateway.toml:/data/config.toml:ro
    tmpfs: [/tmp, "/data:mode=0700"]
    dns: [1.1.1.1]
    devices: [/dev/net/tun:/dev/net/tun]
    cap_add: [NET_ADMIN]
    stop_grace_period: 15s
    depends_on: [mhk-panel, mhk-node1, mhk-node2]
    networks:
      mhk-wan: {ipv4_address: 10.203.0.2}

  # Client behind the gateway (its whole network is the gateway's).
  mhk-app:
    <<: *hardened
    image: curlimages/curl:latest
    container_name: mhk-app
    command: ["sleep", "infinity"]
    network_mode: service:mhk-gw
    depends_on:
      mhk-gw: {condition: service_healthy, restart: true}

  # Explicit proxy for containers on the same network.
  mhk-proxy:
    <<: *hardened
    image: ${MIHOMYAK_IMAGE:?set MIHOMYAK_IMAGE}
    container_name: mhk-proxy
    environment:
      MIHOMYAK_SUB_URL: http://10.203.0.10:8080/sub/proxy
      MIHOMYAK_ALLOW_LAN: "1"
    tmpfs: [/tmp, "/data:mode=0700"]
    depends_on: [mhk-panel, mhk-node1, mhk-node2]
    networks:
      mhk-wan: {ipv4_address: 10.203.0.3}

  mhk-client:
    <<: *hardened
    image: curlimages/curl:latest
    container_name: mhk-client
    command: ["sleep", "infinity"]
    networks:
      mhk-wan: {ipv4_address: 10.203.0.4}

  # Remnawave-like panel: mihomo YAML for FlClashX, device limit 3.
  mhk-panel:
    <<: *panel
    container_name: mhk-panel
    command:
      - python3
      - /e2e/mock_panel.py
      - --host=0.0.0.0
      - --device-limit=3
      - --interval=1
      # aes-128-gcm:lab-password
      - --proxy=ss://YWVzLTEyOC1nY206bGFiLXBhc3N3b3Jk@10.203.0.21:8388#E2E-1
      - --proxy=ss://YWVzLTEyOC1nY206bGFiLXBhc3N3b3Jk@10.203.0.22:8388#E2E-2
    networks:
      mhk-wan: {ipv4_address: 10.203.0.10}

  # Xray JSON for Happ (serveJsonAtBaseSubscription), no device limit.
  mhk-panel-json:
    <<: *panel
    container_name: mhk-panel-json
    command: [python3, /e2e/mock_panel.py, --host=0.0.0.0, --device-limit=0, --serve-json,
              "--proxy=ss://YWVzLTEyOC1nY206bGFiLXBhc3N3b3Jk@10.203.0.21:8388#E2E-1"]
    networks:
      mhk-wan: {ipv4_address: 10.203.0.11}

  # Base64 share links for Happ, no device limit.
  mhk-panel-links:
    <<: *panel
    container_name: mhk-panel-links
    command: [python3, /e2e/mock_panel.py, --host=0.0.0.0, --device-limit=0,
              "--proxy=ss://YWVzLTEyOC1nY206bGFiLXBhc3N3b3Jk@10.203.0.21:8388#E2E-1"]
    networks:
      mhk-wan: {ipv4_address: 10.203.0.12}

  mhk-hostile:
    <<: *hardened
    image: python:3-alpine
    container_name: mhk-hostile
    command: [python3, /e2e/hostile_panel.py, --host=0.0.0.0, --port=8081]
    volumes: [./hostile_panel.py:/e2e/hostile_panel.py:ro]
    networks:
      mhk-wan: {ipv4_address: 10.203.0.13}

  mhk-node1:
    <<: *node
    container_name: mhk-node1
    networks:
      mhk-wan: {ipv4_address: 10.203.0.21}
      mhk-inet: {ipv4_address: 203.0.113.21}

  mhk-node2:
    <<: *node
    container_name: mhk-node2
    networks:
      mhk-wan: {ipv4_address: 10.203.0.22}
      mhk-inet: {ipv4_address: 203.0.113.22}

  mhk-target:
    image: nginx:alpine
    container_name: mhk-target
    volumes: [./target.conf:/etc/nginx/conf.d/default.conf:ro]
    networks:
      mhk-inet: {ipv4_address: 203.0.113.80}

networks:
  mhk-wan:
    name: mhk-e2e-wan
    ipam: {config: [{subnet: 10.203.0.0/24}]}
  mhk-inet:
    name: mhk-e2e-inet
    internal: true
    ipam: {config: [{subnet: 203.0.113.0/24}]}
