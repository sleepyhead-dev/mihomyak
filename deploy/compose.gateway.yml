# Transparent gateway for other containers (recommended).
#
# mihomyak owns a network namespace with a TUN device; every container that joins
# it (`network_mode: service:mihomyak`) is proxied transparently, DNS included.
# No proxy settings inside the apps, no ports exposed to the LAN.
#
#   cp deploy/.env.example deploy/.env && chmod 600 deploy/.env && $EDITOR deploy/.env
#   docker compose -f deploy/compose.gateway.yml up -d
#   docker compose -f deploy/compose.gateway.yml exec mihomyak mihomyak tui

services:
  mihomyak:
    image: ghcr.io/sleepyhead-dev/mihomyak:latest
    # Built from this repository when the image cannot be pulled.
    build: ..
    container_name: mihomyak
    # Reported to the provider by the Happ emulation (X-Device-Model: <hostname>_<arch>).
    hostname: ${MIHOMYAK_HOSTNAME:-home-server}
    restart: unless-stopped
    # Relative to this file: deploy/.env.
    env_file: .env
    environment:
      MIHOMYAK_GATEWAY: "1"
      # Block app traffic while mihomo is down instead of letting it go direct
      # (MIHOMYAK_KILL_SWITCH=0 in .env turns it off).
      MIHOMYAK_KILL_SWITCH: ${MIHOMYAK_KILL_SWITCH:-1}
    volumes:
      - mihomyak-data:/data
      # Optional fine-tuning (groups, filters, cron…): see examples/config.toml.
      # - ./config.toml:/data/config.toml:ro
      # Report the host's distro instead of the image's Alpine in device headers.
      # - /etc/os-release:/etc/os-release:ro
    # Required: without an explicit server Docker resolves the apps' names from the
    # host's namespace, past the tunnel (DNS leak, no fake-ip). Any server works,
    # your router included: mihomo answers while it runs, the server itself is
    # only asked while mihomo is down (first start, restart).
    dns: [1.1.1.1, 8.8.8.8]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    # mihomo idles at ~40 MiB; the cap keeps a runaway core from starving the host.
    mem_limit: 256m
    pids_limit: 256
    # Leaves mihomo time to remove its routes (the supervisor waits 8 s for it).
    stop_grace_period: 15s
    # Ports of the apps below must be published here (they share this namespace).
    ports:
      - "127.0.0.1:8080:8080"

  # Example app routed through the gateway.
  app:
    image: nginx:alpine
    network_mode: service:mihomyak
    depends_on:
      mihomyak:
        condition: service_healthy
        # A restarted gateway gets a new network namespace; apps still in the old
        # one have no network at all. Compose restarts them after the gateway.
        restart: true
    restart: unless-stopped

volumes:
  mihomyak-data:
