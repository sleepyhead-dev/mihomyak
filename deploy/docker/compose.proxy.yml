# mihomyak as an HTTP/SOCKS5 proxy on a shared Docker network.
#
# Apps opt in with HTTP_PROXY / ALL_PROXY and can live in any compose project:
# they join the external network `mihomyak`. Restarting the proxy never breaks
# them. The port is not published to the host.
#
#   put this file and .env (from .env.example, chmod 600) into one directory, then
#   docker compose -f compose.proxy.yml up -d
#
# To build the image from a checkout instead of pulling it, add `build: ../..`.

name: mihomyak

services:
  mihomyak:
    image: ghcr.io/sleepyhead-dev/mihomyak:latest
    container_name: mihomyak
    hostname: ${MIHOMYAK_HOSTNAME:-home-server}
    restart: unless-stopped
    env_file: .env
    environment:
      MIHOMYAK_ALLOW_LAN: "1"
      # Every container of every Docker network may connect (172.16.0.0/12 is
      # private). Set a password in .env: MIHOMYAK_PROXY_AUTH=user:long-random-password
    volumes:
      - data:/data
      # - ./config.toml:/data/config.toml:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    # mihomo idles at ~40 MiB; the cap keeps a runaway core from starving the host.
    mem_limit: 256m
    pids_limit: 256
    stop_grace_period: 15s
    networks: [proxy]
    # Use the proxy from the host itself (loopback only):
    # ports: ["127.0.0.1:7890:7890"]

  # An app of this or any other compose project:
  #
  # my-app:
  #   image: my/app
  #   environment:
  #     HTTP_PROXY: http://mihomyak:7890
  #     HTTPS_PROXY: http://mihomyak:7890
  #     ALL_PROXY: socks5h://mihomyak:7890     # socks5h: DNS through the VPN too
  #     NO_PROXY: localhost,127.0.0.1
  #   networks: [proxy]
  #
  # and in that other project:
  #
  # networks:
  #   proxy:
  #     external: true
  #     name: mihomyak

networks:
  proxy:
    name: mihomyak

volumes:
  data:
